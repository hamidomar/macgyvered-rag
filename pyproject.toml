[project]
name = "turborefi"
version = "0.1.0"
description = "TurboRefi localhost playground built with Agno and deterministic guideline retrieval."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "ag-ui-protocol>=0.1.8",
  "agno>=2.5.10",
  "fastapi[standard]>=0.115.0",
  "openai>=1.40.0",
  "pdfplumber>=0.11.0",
  "pydantic>=2.8.0",
  "pypdf>=5.0.0",
  "python-dotenv>=1.0.1",
  "sqlalchemy>=2.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
